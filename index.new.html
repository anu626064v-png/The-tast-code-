<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कपड़ा बाज़ार - व्हाट्सएप ऑर्डर</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: #f5f0eb;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .design-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .card-img {
            background: #e2dcd5;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
        .card-info {
            padding: 18px;
        }
        .card-info h3 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .price {
            color: #b45f2b;
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
        }
        .order-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .order-btn:hover {
            background: #128C7E;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 450px;
            width: 90%;
            border-radius: 32px;
            padding: 25px;
            animation: fadeIn 0.2s;
        }
        .modal-content h3 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 60px;
            font-size: 15px;
        }
        .modal-content textarea {
            border-radius: 20px;
            resize: vertical;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .send-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 60px;
            flex: 1;
            font-weight: bold;
            cursor: pointer;
        }
        .cancel-btn {
            background: #ccc;
            border: none;
            padding: 12px;
            border-radius: 60px;
            flex: 1;
            cursor: pointer;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧥 कपड़ा बाज़ार - व्हाट्सएप ऑर्डर</h1>
    <div class="design-grid" id="designGrid"></div>
</div>

<div id="orderModal" class="modal">
    <div class="modal-content">
        <h3>📋 ऑर्डर की जानकारी भरें</h3>
        <input type="text" id="customerName" placeholder="आपका नाम *" required>
        <input type="tel" id="customerPhone" placeholder="मोबाइल नंबर (WhatsApp नंबर) *" required>
        <input type="email" id="customerEmail" placeholder="ईमेल">
        <textarea id="customerAddress" rows="3" placeholder="पूरा पता (शहर, जिला, पिन कोड) *" required></textarea>
        <div class="modal-buttons">
            <button class="send-btn" id="sendWhatsAppBtn">📲 WhatsApp पर भेजें</button>
            <button class="cancel-btn" id="closeModalBtn">रद्द करें</button>
        </div>
    </div>
</div>

<script>
    const designs = [
        { id: 1, name: "सिल्क कुर्ता (मैरून)", price: 1999, imgIcon: "👘" },
        { id: 2, name: "लिनन शर्ट - ऑफ व्हाइट", price: 1299, imgIcon: "👕" },
        { id: 3, name: "बनारसी लहंगा", price: 5499, imgIcon: "💃" },
        { id: 4, name: "कॉटन साड़ी (प्रिंटेड)", price: 899, imgIcon: "🧥" }
    ];

    let selectedDesign = null;

    // 👇 यहाँ तुम्हारा नंबर सेट कर दिया (OWNER)
    const ownerNumber = "919301570370";

    function renderDesigns() {
        const grid = document.getElementById('designGrid');
        grid.innerHTML = designs.map(design => `
            <div class="card">
                <div class="card-img">${design.imgIcon} ${design.name.substring(0,2)}</div>
                <div class="card-info">
                    <h3>${design.name}</h3>
                    <div class="price">₹ ${design.price}</div>
                    <button class="order-btn" data-id="${design.id}" data-name="${design.name}" data-price="${design.price}">📦 ऑर्डर करें</button>
                </div>
            </div>
        `).join('');

        document.querySelectorAll('.order-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = parseInt(btn.dataset.id);
                const name = btn.dataset.name;
                const price = btn.dataset.price;
                selectedDesign = { id, name, price };
                openModal();
            });
        });
    }

    function openModal() {
        document.getElementById('orderModal').style.display = 'flex';
        document.getElementById('customerName').value = '';
        document.getElementById('customerPhone').value = '';
        document.getElementById('customerEmail').value = '';
        document.getElementById('customerAddress').value = '';
    }

    function closeModal() {
        document.getElementById('orderModal').style.display = 'none';
        selectedDesign = null;
    }

    function sendOrderOnWhatsApp() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const email = document.getElementById('customerEmail').value.trim();
        const address = document.getElementById('customerAddress').value.trim();

        if(!name || !phone || !address) {
            alert("कृपया नाम, मोबाइल नंबर और पता भरें");
            return;
        }
        if(!selectedDesign) {
            alert("कोई डिज़ाइन सेलेक्ट नहीं है!");
            closeModal();
            return;
        }

        const message = `*🆕 नया ऑर्डर मिला!*%0A%0A` +
                        `*👤 नाम:* ${name}%0A` +
                        `*📞 फोन:* ${phone}%0A` +
                        `*📧 ईमेल:* ${email ? email : "नहीं दिया"}%0A` +
                        `*📍 पता:* ${address}%0A` +
                        `*👕 डिज़ाइन:* ${selectedDesign.name}%0A` +
                        `*💰 कीमत:* ₹${selectedDesign.price}%0A%0A` +
                        `_ऑर्डर की पुष्टि करने के लिए इसी नंबर पर संपर्क करें._`;

        const whatsappUrl = `https://wa.me/${ownerNumber}?text=${message}`;
        closeModal();
        window.open(whatsappUrl, '_blank');
    }

    document.getElementById('sendWhatsAppBtn').addEventListener('click', sendOrderOnWhatsApp);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    window.onclick = function(event) {
        const modal = document.getElementById('orderModal');
        if(event.target === modal) {
            closeModal();
        }
    }

    renderDesigns();
</script>
</body>
          </html>
